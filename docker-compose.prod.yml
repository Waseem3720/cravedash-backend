# ==============================================================================
# CraveDash Production Docker Compose Stack
# Usage on VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
# Optional demo seed:
#   docker compose -f docker-compose.prod.yml --profile seed up seed
# ==============================================================================

name: cravedash

x-common-env: &common-env
  NODE_ENV: production
  PGHOST: postgres
  PGPORT: 5432
  PGUSER: ${PGUSER:-cravedash}
  PGPASSWORD: ${PGPASSWORD:?Database password (PGPASSWORD) must be set in production .env}
  PGDATABASE: ${PGDATABASE:-cravedash}

x-service-env: &service-env
  <<: *common-env
  LISTEN_HOST: "0.0.0.0"

x-service-defaults: &service-defaults
  build: .
  restart: unless-stopped
  env_file: .env
  networks: [cravedash]
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Internal only, not exposed on host ports)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-cravedash}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Database password (PGPASSWORD) must be set in production .env}
      POSTGRES_DB: ${PGDATABASE:-cravedash}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-cravedash} -d ${PGDATABASE:-cravedash}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [cravedash]

  # ----------------------------------------------------------------------------
  # Database Migrations (Runs sequentially once on boot, then terminates)
  # ----------------------------------------------------------------------------
  migrate:
    build: .
    command: ["node", "shared/scripts/migrate.js"]
    restart: "no"
    env_file: .env
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cravedash]

  # ----------------------------------------------------------------------------
  # Optional Demo / Initial Seed (Runs only when explicitly requested)
  # ----------------------------------------------------------------------------
  seed:
    build: .
    profiles: ["seed"]
    command: ["node", "scripts/seed-full.js"]
    restart: "no"
    env_file: .env
    environment:
      <<: *common-env
      ALLOW_DEMO_SEED: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [cravedash]

  # ----------------------------------------------------------------------------
  # API Gateway (Public edge proxy; bound only to loopback port 4100 on host)
  # ----------------------------------------------------------------------------
  gateway:
    build: .
    command: ["node", "services/gateway/src/index.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      PORT: 4000
      GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      ORDER_SERVICE_URL: http://order:4003
      RESTAURANT_SERVICE_URL: http://restaurant:4004
      PLATFORM_SERVICE_URL: http://platform:4005
      EPOS_SERVICE_URL: http://epos:4006
      REPORTING_SERVICE_URL: http://reporting:4007
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      catalog:
        condition: service_started
      order:
        condition: service_started
      restaurant:
        condition: service_started
      platform:
        condition: service_started
      epos:
        condition: service_started
      reporting:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [cravedash]

  # ----------------------------------------------------------------------------
  # Internal Backend Microservices
  # ----------------------------------------------------------------------------
  auth:
    <<: *service-defaults
    command: ["node", "services/auth-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4001

  catalog:
    <<: *service-defaults
    command: ["node", "services/catalog-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4002

  order:
    <<: *service-defaults
    command: ["node", "services/order-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4003

  restaurant:
    <<: *service-defaults
    command: ["node", "services/restaurant-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4004

  platform:
    <<: *service-defaults
    command: ["node", "services/platform-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4005

  epos:
    <<: *service-defaults
    command: ["node", "services/epos-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4006

  reporting:
    <<: *service-defaults
    command: ["node", "services/reporting-service/src/index.js"]
    environment:
      <<: *service-env
      PORT: 4007

# ------------------------------------------------------------------------------
# Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  cravedash:
    name: cravedash_net

volumes:
  pgdata:
    name: cravedash_pgdata
